<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plausible Analytics | Simple</title>
    <link rel="shortcut icon" href="imgs/logo-plausible.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="primeiro">
        <nav class="conteudo">
            <div class="cima">

                <img src="imgs/logocompleto.png" alt="logo-Plausible">
                <div class="opcoes">
                    <div class="menu-item">
                        <h2>Why Plausible</h2>
                        <span>⌄</span>
                    </div>
                    <div class="menu-item">
                        <h2>Resources</h2>
                        <span>⌄</span>
                    </div>
                    <div class="menu-item">
                        <h2>Pricing</h2>
                    </div>
                </div>
                <div class="separada">
                    <h2>Login</h2>
                    <button>Start free trial</button>
                </div>
            </div>
        </nav>
        <section class="hero">
            <h1>Easy to use and privacy-friendly <span>Google Analytics alternative</span></h1>
            <p>Plausible is powerful, lightweight analytics. No cookies, just insights. Made and hosted in the EU, powered by European-owned infrastructure. 🇪🇺</p>
            <div class="hero-btns">
                <button class="btn-primary">Start free trial</button>
                <button class="btn-outline">View live demo</button>
            </div>
        </section>
    </div>
    <section class="stats-wrapper">
        <img src="imgs/estatisticas-imagem.png" alt="estatisticas em imagem">
    </section>
